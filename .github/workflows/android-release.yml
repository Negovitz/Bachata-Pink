# SPDX-License-Identifier: GPL-2.0-or-later
# Fork-only workflow: builds the BachataS4 Android release APK and publishes it
# as a GitHub Release on this fork. Signs with the public AOSP testkey (v1+v2+v3)
# so the APK is directly side-loadable. Not update-compatible with the official app.
name: Android Release APK

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref (tag/branch/sha) to build"
        default: "v0.1.7"
        required: true
      version_name:
        description: "versionName override"
        default: "0.1.7"
        required: true
      version_code:
        description: "versionCode override"
        default: "26080313"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          submodules: false
          fetch-depth: 0

      - name: Init libadrenotools submodule (only one the APK needs)
        run: git submodule update --init --recursive externals/winlator-app

      - name: Vendor Vortek server sources (runtime/sources/winlator-app @ pinned rev)
        run: |
          chmod +x runtime/scripts/checkout-component.sh
          runtime/scripts/checkout-component.sh \
            winlator-app \
            https://github.com/brunodev85/winlator-app.git \
            e113da42beefc39c69c8944b27c19c3703bfa856
          test -f runtime/sources/winlator-app/app/src/main/cpp/vortekrenderer/src/request_handler.c

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK / CMake / build-tools / platform
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --install "build-tools;36.0.0" "ndk;30.0.14904198" "cmake;3.22.1"
          # compileSdk 37 may only be in a preview channel on this runner image.
          if ! sdkmanager --install "platforms;android-37"; then
            for ch in 1 2 3; do
              echo "::group::Trying channel $ch for platforms;android-37"
              yes | sdkmanager --channel=$ch --licenses >/dev/null 2>&1 || true
              if sdkmanager --channel=$ch --install "platforms;android-37"; then
                echo "installed from channel $ch"; break
              fi
              echo "::endgroup::"
            done
          fi
          echo "=== installed platforms ==="
          sdkmanager --list_installed 2>/dev/null | grep -i 'platforms;android' || true

      - name: Build fdroid release (unsigned)
        working-directory: android/BachataS4
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleFdroidRelease \
            -PVERSION_NAME=${{ inputs.version_name }} \
            -PVERSION_CODE=${{ inputs.version_code }} \
            --no-daemon --stacktrace

      - name: Locate unsigned APK
        id: apk
        working-directory: android/BachataS4
        run: |
          f=$(find app/build/outputs/apk/fdroid/release -name '*.apk' | head -1)
          if [ -z "$f" ]; then echo "No APK produced" >&2; exit 1; fi
          echo "path=$GITHUB_WORKSPACE/android/BachataS4/$f" >> "$GITHUB_OUTPUT"

      - name: Fetch AOSP testkey
        run: |
          base=https://raw.githubusercontent.com/aosp-mirror/platform_build/main/target/product/security
          mkdir -p signing
          curl -fsSL -o signing/testkey.pk8 "$base/testkey.pk8"
          curl -fsSL -o signing/testkey.x509.pem "$base/testkey.x509.pem"

      - name: Zipalign + sign (v1 v2 v3)
        id: sign
        run: |
          BT="$ANDROID_HOME/build-tools/36.0.0"
          OUT="bachatas4-${{ inputs.version_name }}-release.apk"
          "$BT/zipalign" -p -f 4 "${{ steps.apk.outputs.path }}" aligned.apk
          "$BT/apksigner" sign \
            --key signing/testkey.pk8 --cert signing/testkey.x509.pem \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --v4-signing-enabled false \
            --out "$OUT" aligned.apk
          "$BT/apksigner" verify --verbose --print-certs "$OUT"
          echo "out=$OUT" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: bachatas4-${{ inputs.version_name }}-release
          path: ${{ steps.sign.outputs.out }}

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ inputs.version_name }}"
          OUT="${{ steps.sign.outputs.out }}"
          NOTES="Fork build of ${TAG} (ref \`${{ inputs.ref }}\`). fdroid flavor, arm64-v8a. Signed with the public AOSP testkey (v1+v2+v3) — side-load only, not update-compatible with the official Bachata S4 app."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$OUT" --clobber
          else
            gh release create "$TAG" "$OUT" --title "BachataS4 $TAG (fork build)" --notes "$NOTES"
          fi
